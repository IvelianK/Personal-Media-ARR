# Mantiene al día las acciones del workflow (fijadas por SHA) y la imagen base de langguard.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /tools/langguard
    schedule:
      interval: weekly
